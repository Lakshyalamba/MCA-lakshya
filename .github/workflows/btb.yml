name: BTB verification
on:
  push:
  pull_request:
jobs:
  btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: BTB functional tests
        run: make test-btb
      - name: BTB checked synthesis
        run: make synth-btb-checked
